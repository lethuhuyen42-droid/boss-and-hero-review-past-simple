<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero vs Boss – Past Simple Practice</title>
<style>
:root{--bg:#f6e7c8;--card:#fff8e8;--ink:#3b2a1a;--line:#8a5a2b;--ok:#2e9e4f;--bad:#d9433b;--acc:#e08a1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2018;--card:#3a2c20;--ink:#f6e7c8;--line:#c28a4a}}
:root[data-theme="dark"]{--bg:#2a2018;--card:#3a2c20;--ink:#f6e7c8;--line:#c28a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{margin:4px 0;font-size:26px;text-align:center}
.sub{text-align:center;margin:0 0 10px;opacity:.85}
button{font:inherit;cursor:pointer;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-weight:bold;font-size:18px}
button:active{transform:scale(.97)}
.menu button{display:block;width:100%;margin:8px 0;text-align:left}
.menu small{display:block;font-weight:normal;font-size:14px;opacity:.8}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:18px}
.bar{height:16px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.12)}
.bar i{display:block;height:100%;width:100%;background:var(--bad);transition:width .3s}
.bar.t i{background:var(--acc);transition:width .1s linear}
.arena{display:flex;justify-content:space-between;align-items:center;font-size:56px;padding:6px 18px}
.shake{animation:sh .35s}.hit{animation:ht .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes ht{50%{transform:scale(1.3) rotate(8deg)}}
.q{font-size:22px;text-align:center;margin:8px 0 14px;min-height:56px}
.opts button{display:block;width:100%;margin:8px 0;font-size:22px}
.opts .ok{background:var(--ok);color:#fff}.opts .no{background:var(--bad);color:#fff}
#fb{font-size:17px;margin-top:8px;min-height:24px}
.next{width:100%;margin-top:8px;background:var(--acc);color:#fff}
.say{font-size:20px;padding:4px 12px;margin-left:6px}
.big{font-size:64px;text-align:center}
.rv{border-left:6px solid var(--bad);padding:6px 10px;margin:8px 0;background:rgba(0,0,0,.06);border-radius:6px;font-size:16px}.rv .g{color:var(--ok);font-weight:bold}.rv .w{color:var(--bad);font-weight:bold}</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>[...a].sort(()=>Math.random()-.5);
const IRR=[["go","went"],["see","saw"],["eat","ate"],["buy","bought"],["have","had"],["make","made"],["take","took"],["come","came"],["give","gave"],["write","wrote"],["run","ran"],["drink","drank"],["sit","sat"],["get","got"],["say","said"],["swim","swam"],["read","read"],["meet","met"],["sleep","slept"],["drive","drove"],["ride","rode"],["fly","flew"],["know","knew"],["find","found"],["do","did"],["bring","brought"],["tell","told"],["sing","sang"]];
const ED=[["played","/d/"],["watched","/t/"],["wanted","/ɪd/"],["jumped","/t/"],["cleaned","/d/"],["visited","/ɪd/"],["helped","/t/"],["opened","/d/"],["needed","/ɪd/"],["washed","/t/"],["listened","/d/"],["started","/ɪd/"],["cooked","/t/"],["studied","/d/"],["danced","/t/"],["painted","/ɪd/"],["stayed","/d/"],["looked","/t/"],["decided","/ɪd/"],["enjoyed","/d/"]];
const SEN=[["Yesterday, I ___ (play) football.","played","play","plays"],["She ___ (go) to Da Nang last summer.","went","goed","goes"],["We ___ (watch) TV last night.","watched","watch","watching"],["He didn't ___ (eat) breakfast this morning.","eat","ate","eats"],["They ___ (visit) their grandparents last weekend.","visited","visit","visiting"],["Did you ___ (see) the movie yesterday?","see","saw","seen"],["My mother ___ (cook) dinner two hours ago.","cooked","cook","cooks"],["I ___ (buy) a new bag last week.","bought","buyed","buy"],["She ___ (study) English yesterday evening.","studied","studyed","studies"],["Tom ___ (have) a big lunch yesterday.","had","haved","has"],["We didn't ___ (go) to school on Sunday.","go","went","goes"],["Mai ___ (take) many photos last Sunday.","took","taked","takes"],["Did they ___ (clean) the room last night?","clean","cleaned","cleans"],["My dad ___ (drive) to work yesterday.","drove","drived","drives"]];
const reg=v=>/e$/.test(v)?v+"d":/[^aeiou]y$/.test(v)?v.slice(0,-1)+"ied":v+"ed";
const TIP="Pronounce -ed as /t/ after voiceless sounds (p, k, s, sh, ch, x); /ɪd/ after t or d; otherwise /d/.";
function build(){
  const irr=IRR.map(([v,p])=>({q:`What is the past simple of <b>${v}</b>?`,a:p,o:sh([...new Set([p,v,reg(v)])]),tip:`${v} → ${p} (irregular verb)`}));
  const ed=ED.map(([w,a])=>({q:`How do we pronounce the -ed in <b>${w}</b>?`,a,o:["/t/","/d/","/ɪd/"],say:w,tip:`${w} → ${a}. ${TIP}`}));
  const sen=SEN.map(([t,a,b,c])=>({q:t.replace("___","<b>___</b>"),a,o:sh([a,b,c]),tip:/Did|didn't/.test(t)?"After did / didn't, the verb stays in its base form.":"Words like yesterday / last / ago → use the past simple."}));
  return sh([...sh(irr).slice(0,7),...sh(ed).slice(0,6),...sh(sen).slice(0,7)]);
}
const say=w=>{try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
let G;
let NAME="";
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function intro(){
  app.innerHTML=`<h1>🗡️ Hero vs Boss</h1><p class="sub">Past simple · Irregular verbs · -ed sounds<br>20 questions · 15 seconds each</p>
  <div class="card"><div class="q" style="min-height:0">What's your name, hero?</div>
  <input id="nm" maxlength="20" placeholder="Type your name" autocomplete="off" style="width:100%;font:inherit;font-size:22px;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center">
  <button class="next" id="go" style="font-size:22px">Start ➜</button><div id="fb"></div></div>`;
  const go=()=>{const v=$("#nm").value.trim();if(!v){$("#fb").textContent="Please type your name first 🙂";return}NAME=v;start()};
  $("#go").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()};$("#nm").focus();
}
function start(){G={qs:build(),i:0,ok:0,wrong:[],left:15,t:0};show()}
function show(){
  const q=G.qs[G.i];G.left=15;G.done=false;
  app.innerHTML=`<div class="card"><div class="top"><span>🧙 ${esc(NAME)}</span><span>${G.i+1}/${G.qs.length}</span><span>⭐ ${G.ok}</span></div>
  <div class="arena"><span id="h">🧙</span><span id="b">🐲</span></div>
  <div class="bar" title="Boss HP"><i id="bh" style="width:${100-G.ok/G.qs.length*100}%"></i></div></div>
  <div class="card"><div class="bar t"><i id="tm"></i></div>
  <div class="q">${q.q}${q.say?` <button class="say" id="sp">🔊</button>`:""}</div>
  <div class="opts">${q.o.map(o=>`<button>${o}</button>`).join("")}</div><div id="fb"></div></div>`;
  if(q.say){$("#sp").onclick=()=>say(q.say);say(q.say)}
  app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>ans(b.textContent,b));
  clearInterval(G.t);
  G.t=setInterval(()=>{G.left-=.1;$("#tm").style.width=G.left/15*100+"%";if(G.left<=0)ans(null)},100);
}
function ans(v,btn){
  if(G.done)return;G.done=true;clearInterval(G.t);
  const q=G.qs[G.i],good=v===q.a;
  app.querySelectorAll(".opts button").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("ok")});
  if(good){G.ok++;$("#b").classList.add("shake");$("#bh").style.width=100-G.ok/G.qs.length*100+"%"}
  else{G.wrong.push({q:q.q,you:v,a:q.a,tip:q.tip});if(btn)btn.classList.add("no");$("#h").classList.add("shake")}
  const last=G.i==G.qs.length-1;
  $("#fb").innerHTML=(good?"✅ <b>Correct!</b>":v===null?"⏰ <b>Time's up!</b>":"❌ <b>Not quite.</b>")+`<br>💡 ${q.tip}<button class="next">${last?"See results":"Next ➜"}</button>`;
  $(".next").onclick=()=>{last?end():(G.i++,show())};
}
function end(){
  const n=G.qs.length,p=G.ok/n,st=p>=.9?"⭐⭐⭐":p>=.7?"⭐⭐":p>=.5?"⭐":"";
  const msg=p>=.9?"Amazing, "+esc(NAME)+"! You defeated the Boss!":p>=.7?"Great job, "+esc(NAME)+"! Boss defeated!":p>=.5?"Good try! Review and play again.":"Keep practicing, "+esc(NAME)+"!";
  app.innerHTML=`<div class="card"><div class="big">${p>=.5?"🏆":"💪"}</div><h1>${esc(NAME)}: ${G.ok} / ${n}</h1>
  <p class="sub">${st}<br>${msg}</p>
  <button style="width:100%" id="a">🔁 Play again</button></div>
  <div class="card"><h1 style="font-size:22px">${G.wrong.length?`Review: ${G.wrong.length} mistake${G.wrong.length>1?"s":""}`:"🎉 No mistakes!"}</h1>
  ${G.wrong.map(w=>`<div class="rv">${w.q}<br>Your answer: <span class="w">${w.you??"(no answer)"}</span> · Correct: <span class="g">${w.a}</span><br>💡 ${w.tip}</div>`).join("")}</div>`;
  $("#a").onclick=start;
}
intro();
</script></body></html>
